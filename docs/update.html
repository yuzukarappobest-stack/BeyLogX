<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ベイログXを更新</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
    body { display: grid; min-height: 100svh; margin: 0; padding: 24px; place-items: center; color: #172033; background: #f2f4f7; box-sizing: border-box; }
    main { width: min(420px, 100%); padding: 28px; text-align: center; background: white; border-radius: 20px; box-shadow: 0 16px 50px rgba(17,24,39,.12); box-sizing: border-box; }
    h1 { margin: 0 0 10px; font-size: 1.25rem; }
    p { margin: 0; color: #687386; font-size: .88rem; line-height: 1.7; }
    .spinner { width: 34px; height: 34px; margin: 22px auto; border: 4px solid #e4e8ee; border-top-color: #ec4c26; border-radius: 50%; animation: spin .8s linear infinite; }
    a { display: inline-block; margin-top: 18px; color: #c63b1b; font-weight: 700; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <h1>ベイログXを最新版に更新中</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">古いキャッシュを解除しています。対戦データは削除されません。</p>
    <a id="manual-link" href="./" hidden>アプリを開く</a>
  </main>
  <script>
    async function resetAppCache() {
      try {
        const registrations = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(registrations.map(registration => registration.unregister()));
        const cacheNames = await caches?.keys?.() || [];
        await Promise.all(cacheNames.map(name => caches.delete(name)));
        location.replace(`./?updated=${Date.now()}`);
      } catch (error) {
        console.error(error);
        document.querySelector("#status").textContent = "自動更新できませんでした。下のリンクからアプリを開き、再読み込みしてください。";
        document.querySelector("#manual-link").hidden = false;
      }
    }
    resetAppCache();
  </script>
</body>
</html>
